<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
            flex-wrap: wrap;
            
        }
        #one{
            background-color: lightgray;
            height: 100px;
            min-width: 300px;
            flex:3;
        }
        #two{
            background-color: lightskyblue;
            height: 100px;
            min-width: 200px;
            flex: 1;
        }
        #three{
            background-color: lightcyan;
            height: 100px;
            min-width: 200px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="one">1</div>
        <div id="two">2</div>
        <div id="three">3</div>
    </div>
</body>
</html>
