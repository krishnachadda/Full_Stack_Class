<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
    }
    .box{
        display: flex;
        width: 100%;
        height: 70px;
        background-color: black;
    }
    .logo{
        display: flex;
        align-items: center;
        width: 20%;
        height: 100%;
    }
    img{
        height: 100%;
        width: 50%;
        object-fit: contain;
    }
    .pages{
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 60%;
    }
    a:visited{
        color: green;
    }
    a:link{
        color: white;
    }
    .log-in{
        display: flex;
        width: 20%;
        justify-content: center;
        align-items: center;
    }
    .log-in button{
        font-size: 20px;
        background-color: blue;
        color: white;
        border: 0px solid transparent;
    }
    img{
        background-color: black;
    }
</style>
<body>
    <div class="box">
        <div class="logo">
            <img src="https://static.vecteezy.com/system/resources/previews/014/018/579/original/ms-365-logo-on-transparent-background-free-vector.jpg" alt="">
            <p style="color: white; font-size: 20px;">Web Dev</p>
        </div>
        <div class="pages">
                <a href="#6">Home</a>
                <a href="#3">About</a>
                <a href="#4">Content</a>
                <a href="#5">Elements</a>
        </div>
        <div class="log-in">
            <button>Log In</button>
        </div>
    </div>
</body>
</html>
