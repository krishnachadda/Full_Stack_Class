<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
            height: 600px;
            width: 500px;
            border: 2px solid black;
            justify-content: center;
            align-items: center;
        }
        .login-box{
            height: 300px;
            width: 250px;
            border: 2px solid black;
        }
        .login{
            display: flex;
            width: 100%;
            height: 25%;
            justify-content: center;
            align-items: center;
        }
        p{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            margin: 4px 0px;
            font-weight: bold;
        }
        .details{
            height: 100%;
            width: 100%;
        }
        input{
            font-size: 15px;
        }
        button{
            margin-top: 10px;
            margin-left: 35%;
            font-size: 15px;
            background-color: lightgreen;
        }
        .details input , button{
            box-shadow: 3px 3px 5px gray;
            border: 0px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="login-box">
            <div class="login">
                <p>login</p>
            </div>
            <div class="details">
                <p>UserName</p>
                <input type="text" placeholder="UserName">
                <p>PassWord</p>
                <input type="text" placeholder="password">
                <button>Sign In</button>
            </div>
        </div>
    </div>
</body>
</html>
