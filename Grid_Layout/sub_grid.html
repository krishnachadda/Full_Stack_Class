<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Amigo!!!....</title>
    <style>
        :root{
            --primary-color:rgb(163, 182, 230);
            --secondary-color: rgb(181, 226, 241);

            --font-size:20px;
            --variable:40px;

        }
        div{
            --primary-color:blue;
            --secondary-color: red;
        }
        body{
            height: 98vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height: 500px;
            width: 500px;
            outline: 2px solid gray;
             border-radius: 50%;
            background-color: var(--primary-color);
            
        }
        .parent{
            display: grid;
            grid-template-columns: subgrid;
            grid-template-rows: subgrid;
            grid-column: 1/3;
            grid-row: 1/3;
            outline: 2px solid gray;
            border-radius: 50%;
            background-color: var(--secondary-color)
        }
        .child{
            background-color: lightcyan;
            display: flex;
            outline: 2px solid gray;
            justify-content: center;
            align-items: center;
            color: var(--primary-color);
            border-radius: 50%;
            font-size: calc(var(--font-size) * 2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="parent">
            <div class="child">1</div>
        </div>
    </div>
    <div class="container1">
        <div class="paren1">
            <div class="child1"></div>
        </div>
    </div>
</body>
</html>
