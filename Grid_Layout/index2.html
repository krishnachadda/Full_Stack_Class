<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 98vh;
            margin: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            outline: 2px solid gray;
            height: 500px;
            width: 500px;
        }
        .container > div{
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: 2px dotted gray;
            background-color: beige;
        }
        #box1{
            grid-column: 1/4;
            grid-row: 1/3;
            /* background-color: lightcyan; */
        }
        #box6{
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 2;
            /* background-color: lightgreen; */
        }
        .container > div:nth-child(1){
            background-color: lightcyan;
        }
        .container > div:nth-child(2){
            background-color: lightcyan;
        }
        .container > div:nth-child(3){
            background-color: lightcyan;
        }
        .container > div:nth-child(4){
            background-color: lightcyan;
        }
        .container > div:nth-child(5){
            background-color: lightcyan;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id = "box1">1</div>
        <div id = "box2">2</div>
        <div id = "box3">3</div>
        <div id = "box4">4</div>
        <div id = "box5">5</div>
        <div id = "box6">6</div>
        <div id = "box7">7</div>
    </div>
</body>
</html>
