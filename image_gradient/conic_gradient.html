<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .box{
            height: 100px;
            width: 100px;
            background: conic-gradient(black 0deg , blue 260deg , lightblue 270deg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .inner-box{
            height: 70px;
            width: 70px;
            border-radius: 50%;
            background-color: black;
            color: white ;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="inner-box"> 87%</div>
    </div>
</body>
</html>
