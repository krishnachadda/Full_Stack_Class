<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2 + p {
            color: blue;
        }
        h2 ~ p{
            font-family: Arial, Helvetica, sans-serif;
           text-transform :uppercase;
        }
        section h2 {
            text-shadow: 1px 1px 0 black;
        }
        section>h2{
            text-transform: lowercase;
            color: yellow;
        }
    </style>
</head>
<body>
    <section>
        <h2>
            Heading 
        </h2>
        <p>para 1</p>
        <p>para 2</p>
        <div>
            <h2>
                Heading 2
            </h2>
        </div>
    </section> 
</body>
</html>
