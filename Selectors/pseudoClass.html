<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        button:hover{
            background-color: black;
            color: white;
            cursor: pointer;
        }
        button:active{
            background-color: blue;
            color: azure;
        }
        button:focus{
            background-color: aqua;
        }
        a:link{
            color: black;   
        }
        a:visited{
            color: green;
        }
        input:checked{
            box-shadow: 2px 2px 5px black;
            accent-color:green;

        }
        li:nth-child(2n){
            background-color: yellow;
        }
        li:not(:nth-child(3n)){
            background-color: red;
        }
</style>
</head>

<body>
    <button>
        Click Me !!
    </button>
    <a href="#3"> Link </a>
    <input type="checkbox" checked>

    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
        <li>7</li>
    </ul>
</body>
</html>
