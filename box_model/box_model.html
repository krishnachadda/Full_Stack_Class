<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container {
        min-height: 600vh;
    }

    .box {
        position: sticky;
        left: 0;
        width: 100%;
        height: 100vh;
        display: inline-block;
    }

    .box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class = "box" id="box1"><img src="https://cdn.marvel.com/content/2x/online_char_avengehonor_series_ironman_v1_lg_0.jpg" ></div>
        <div class = "box" id="box2"><img src="https://cdn.marvel.com/content/2x/online_char_avengehonor_series_captam_v2_lg_2.jpg" ></div>
        <div class = "box" id="box3"><img src="https://cdn.marvel.com/content/2x/online_char_avengehonor_series_thor_v1_lg_1.jpg"></div>
        <div class = "box" id="box4"><img src="https://cdn.marvel.com/content/2x/online_char_avengehonor_series_hawkeye_v1_lg_0.jpg"></div>
        <div class = "box" id="box5"><img src="https://cdn.marvel.com/content/2x/online_char_avengehonor_series_rocket_v2_lg_0.jpg"></div>
    </div>
</body>
</html>
