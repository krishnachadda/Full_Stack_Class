<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            border-width:0px 0px 4px 0px;
            display: block;
            margin-bottom: 5px;
        }
        input:required{
            border-color: red;
        }
        input:optional{
            border-color: green;
        }
        input:disabled{
            border: 0px;
            background-color: lightgray;
        }
        input:invalid{
            background-color: red;
        }
        input:in-range{
            background-color: grey;
        }
        input:out-of-range{
            background-color: red;
        }
    </style>
</head>
<body>
        <input type="text" placeholder="First Name" required/>
        <input type="text" placeholder="Middle Name" optional/>
        <input type="text" placeholder="Last Name" required/>
        <input type="text" value="Mathura" disabled/>
        <input type="email" placeholder="Email@.com" />
        <input type="number" min="10" max="100" placeholder="age">
</body>
</html>
