```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Grid Auto Fit and Auto Fill</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            margin-top: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .box {
            background-color: lightblue;
            padding: 40px;
            text-align: center;
            font-size: 20px;
        }

        .auto-fill {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
    </style>
</head>

<body>

    <h1>CSS Grid</h1>

    <!-- AUTO-FIT -->
    <h2>Auto Fit</h2>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>


    <!-- AUTO-FILL -->
    <h2>Auto Fill</h2>

    <div class="grid auto-fill">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
```
