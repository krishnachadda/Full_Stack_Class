<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        .container {
            height: 740px;
            width: 900px;
            outline: 2px solid black;
            margin: 20px auto;
        }

        .box1 {
            height: 100%;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 1fr 4fr 3fr 3fr;
            grid-template-areas:
                "box1 box1 box1"
                "box2 box3 box3"
                "box2 box4 box5"
                "box6 box6 box6";
        }

        .box1 > div {
            outline: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1">

            <div style="grid-area: box1; background-color: #ffadad;">Box 1</div>

            <div style="grid-area: box2; background-color: #ffd6a5;">Box 2</div>

            <div style="grid-area: box3; background-color: #fdffb6;">Box 3</div>

            <div style="grid-area: box4; background-color: #caffbf;">Box 4</div>

            <div style="grid-area: box5; background-color: #9bf6ff;">Box 5</div>

            <div style="grid-area: box6; background-color: #a0c4ff;">Box 6</div>

        </div>

    </div>

</body>
</html>
